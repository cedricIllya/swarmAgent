# Control plane (apps/web). Агенты — отдельные приложения swarm-<id>, их создаёт код.
app = "swarm-control-plane"
primary_region = "ams"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  APP_URL = "https://swarm.cedricillya.online"
  # Receiving-домен Mailgun. MX, SPF и DKIM стоят у регистратора (reg.ru).
  AGENTS_DOMAIN = "cedricillya.online"
  # Аккаунт Mailgun живёт в US: с дефолтным eu API отвечает пустотой.
  MAILGUN_REGION = "us"
  FLY_ORG = "copyboy"
  FLY_REGION = "ams"

[http_service]
  internal_port = 3000
  force_https = true
  # Нет запросов несколько минут — машина засыпает (CPU и RAM не тарифицируются).
  # Письмо Mailgun и открытие сайта будят её сами. Код в браузер вводит
  # машина агента, ей этот процесс не нужен постоянно.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  release_command = "node /migrate/src/migrate.ts"
