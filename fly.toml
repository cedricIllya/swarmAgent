# Control plane (apps/web). Агенты — отдельные приложения swarm-<id>, их создаёт код.
app = "swarm-control-plane"
primary_region = "ams"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  APP_URL = "https://swarm-control-plane.fly.dev"
  # Почта агентов заработает, когда у домена появятся MX. Пока адрес приложения.
  AGENTS_DOMAIN = "swarm-control-plane.fly.dev"
  FLY_ORG = "anton-seidler"
  FLY_REGION = "ams"

[http_service]
  internal_port = 3000
  force_https = true
  # Вебхук Mailgun и ожидание кода в браузере требуют всегда живого процесса.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  release_command = "node /migrate/src/migrate.ts"
