# Пуш в main пересобирает образ runtime и затем выкладывает control plane.
# Образ помечается SHA коммита; тот же SHA уходит в control plane как RELEASE,
# и он сам переводит машины уже созданных агентов на новый образ.
# Секреты: FLY_API_TOKEN (deploy swarm-control-plane),
# FLY_RUNTIME_API_TOKEN (deploy swarm-agent-runtime).
name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-image:
    name: Runtime image
    runs-on: ubuntu-latest
    concurrency:
      group: fly-swarm-agent-runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Push swarm-agent-runtime:${{ github.sha }}
        run: flyctl deploy --remote-only --build-only --push --image-label "$GITHUB_SHA" -c fly.runtime.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RUNTIME_API_TOKEN }}

  control-plane:
    name: Control plane
    # Образ агента должен лежать в реестре до того, как control plane начнёт на него переводить машины.
    needs: runtime-image
    runs-on: ubuntu-latest
    concurrency:
      group: fly-swarm-control-plane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy swarm-control-plane
        run: flyctl deploy --remote-only --ha=false --build-arg "RELEASE=$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
